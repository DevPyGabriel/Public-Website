    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "¿Cómo puedo solicitar un traslado o cotización?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Puedes hacerlo desde la sección de contacto o pulsando 'Cotizar traslado'. Solo necesitamos tu punto de partida, destino, tipo de servicio, fecha y horario para darte una respuesta rápida."
            }
          },
          {
            "@type": "Question",
            "name": "¿Qué servicios ofrecen?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ofrecemos Taxi Express, Transporte Escolar, Transporte Universitario y Transporte Empresarial. Cada uno se adapta a tus recorridos y frecuencia (puntual o recurrente)."
            }
          },
          {
            "@type": "Question",
            "name": "¿Qué zonas cubren?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Atendemos prioritariamente la zona de Sol Amada y sus alrededores en Maracaibo. Si necesitas una zona distinta, contáctanos directamente para consultar cupo y disponibilidad."
            }
          },
          {
            "@type": "Question",
            "name": "¿Cuál vehículo brinda el servicio?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Brindamos el servicio en una Dodge Journey: un vehículo espacioso, con capacidad para 7 puestos y aire acondicionado en excelente estado para viajar fresco y cómodo."
            }
          },
          {
            "@type": "Question",
            "name": "¿Con cuánta anticipación debo reservar?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Para traslados puntuales recomendamos reservar con al menos 1–2 horas de anticipación. Para rutas escolares, universitarias o empresariales lo ideal es con unos días de anticipación."
            }
          },
          {
            "@type": "Question",
            "name": "¿Qué formas de pago aceptan?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Trabajamos con acuerdo previo según el tipo de servicio. Los traslados puntuales suelen ser por viaje. Las rutas programadas se organizan con pago mensual o cada 15 días, según lo acordado."
            }
          },
          {
            "@type": "Question",
            "name": "¿Es seguro el servicio para menores de edad?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí. Para el Transporte Escolar priorizamos la seguridad, organización y puntualidad. Coordinamos los recorridos con cada familia y mantenemos información clara sobre horarios y puntos de recogida."
            }
          },
          {
            "@type": "Question",
            "name": "¿Qué garantiza la puntualidad?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Coordinamos horarios con base en la ruta, el tráfico y los puntos de recogida. Al tratarse de servicios programados, buscamos minimizar imprevistos y mantenemos comunicación clara con el cliente ante cualquier ajuste."
            }
          },
          {
            "@type": "Question",
            "name": "¿Hay un mínimo de pasajeros para activar una ruta?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No tenemos un mínimo fijo. Analizamos cada solicitud (zona, horarios y frecuencia). Si hay coincidencias de ruta, podemos optimizarla para hacerla viable para todos."
            }
          }
        ]
      }
